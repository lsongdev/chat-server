{{define "content"}}
<h3>Create New Conversation</h3>
<form id="createConversationForm">
    <div>
        <label for="conversationName">Conversation Name</label>
        <input type="text" name="name" required value="test">
    </div>
    <div>
        <label>Members</label>
        <input type="email" name="members" placeholder="Enter member email" value="song940@gmail.com">
        <input type="email" name="members" placeholder="Enter member email" value="song940@gmail.com">
    </div>

    <button type="submit">Create Conversation</button>
</form>

<h3>Send Message to Conversation</h3>
<form id="sendMessageForm" method="POST" action="/messages" >
    <label for="conversation_id">Conversation ID</label>
    <input type="text" name="conversation_id" value="ca9fbc8e-8a48-4205-9208-80870f8ec951">
    <label for="content">Message</label>
    <textarea name="content" id="content" placeholder="Enter message">hi</textarea>
    <button type="submit">Send</button>
</form>
<script type="module">
import { serialize } from "https://lsong.org/scripts/dom/form.js"

document.getElementById('createConversationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = serialize(e.target);
    formData.members = [
        "song940@gmail.com",
    ];
    console.log(formData);
    const response = await fetch("/conversations", {
        method: "POST",
        body: JSON.stringify(formData),
    })
    const data = await response.json();
    console.log(data);
    
});

document.getElementById('sendMessageForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = serialize(e.target);
    const response = await fetch("/messages", {
        method: "POST",
        body: JSON.stringify(formData),
    })
    const data = await response.json();
    console.log(data);
});
</script>
{{end}}
