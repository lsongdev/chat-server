<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chat</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --card: #fff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --line: #3f3f46;
        --accent: #60a5fa;
        --accent-soft: #172554;
        --danger: #f87171;
        --danger-soft: #450a0a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    button, input, textarea { font: inherit; border-radius: 9px; }
    button { border: 0; padding: 9px 15px; background: var(--text); color: var(--bg); font-weight: 650; cursor: pointer; }
    button.secondary { color: var(--text); background: transparent; border: 1px solid var(--line); }
    button.link { margin: 0; padding: 0; color: var(--muted); background: none; border: 0; border-radius: 0; font-weight: 400; }
    button.danger { color: var(--danger); background: transparent; border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line)); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    input, textarea { width: 100%; min-width: 0; padding: 10px 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); }
    input:focus, textarea:focus { border-color: var(--accent); outline: 3px solid color-mix(in srgb, var(--accent) 18%, transparent); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 19px; letter-spacing: -.03em; }
    h2 { font-size: 19px; letter-spacing: -.02em; }
    h3 { margin-bottom: 10px; font-size: 15px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .topbar { min-height: 68px; border-bottom: 1px solid var(--line); background: var(--card); }
    .topbar-inner { width: min(100% - 32px, 1180px); min-height: 68px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; }
    .brand-mark { display: grid; width: 23px; height: 23px; place-items: center; border-radius: 7px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 800; }
    .account { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--line); object-fit: cover; }
    .avatar.small { width: 30px; height: 30px; }
    .identity-row { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .workspace { width: min(100% - 32px, 1180px); height: calc(100vh - 100px); min-height: 620px; margin: 16px auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgb(0 0 0 / 3%); }
    .sidebar { display: flex; min-height: 0; flex-direction: column; overflow: hidden; }
    .sidebar-head { padding: 20px; border-bottom: 1px solid var(--line); }
    .sidebar-head p { margin-top: 3px; }
    .create-form { display: grid; gap: 8px; margin-top: 16px; }
    .create-form button { justify-self: start; }
    #conversations { margin: 0; padding: 8px; overflow: auto; list-style: none; }
    #conversations li + li { margin-top: 3px; }
    .conversation-button { width: 100%; padding: 11px 12px; color: var(--text); background: transparent; border: 1px solid transparent; text-align: left; font-weight: 500; }
    .conversation-button:hover { background: var(--bg); }
    .conversation-button.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); }
    .conversation-row { display: flex; justify-content: space-between; gap: 8px; }
    .unread { color: var(--accent); }
    .chat { display: grid; min-width: 0; min-height: 0; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
    .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .chat-head p { margin-top: 2px; }
    #settings-panel { padding: 0 20px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
    #settings-panel[hidden] { display: none; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding-top: 16px; }
    .settings-section { padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 11px; }
    .settings-section.wide { grid-column: 1 / -1; }
    .inline-form { display: flex; align-items: flex-end; gap: 8px; }
    .field { min-width: 0; flex: 1; }
    label { display: block; margin-bottom: 4px; font-weight: 650; }
    .status { min-height: 22px; margin-top: 9px; color: var(--muted); overflow-wrap: anywhere; }
    .status.error { color: var(--danger); }
    .search-result { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; }
    .search-result[hidden] { display: none; }
    .member-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .member-row:last-child { border-bottom: 0; }
    .member-email { font-weight: 650; overflow-wrap: anywhere; }
    .member-meta { color: var(--muted); font-size: 13px; }
    .danger-zone { margin-top: 10px; padding: 12px; color: var(--danger); background: var(--danger-soft); border-radius: 9px; }
    .danger-zone[hidden] { display: none; }
    #events { min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
    .message-row { display: flex; max-width: min(78%, 740px); align-items: flex-end; gap: 8px; }
    .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .message-body { min-width: 0; }
    .message-author { margin: 0 4px 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .message-row.mine .message-author { text-align: right; }
    .message { padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-row.mine .message { color: #fff; background: var(--accent); border-color: var(--accent); }
    .system { align-self: center; color: var(--muted); font-size: 13px; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    #composer { display: flex; gap: 8px; padding: 15px 20px; border-top: 1px solid var(--line); }
    #composer button { margin: 0; }
    #notice { width: min(100% - 32px, 1180px); min-height: 0; margin: 0 auto; }
    #notice:not(:empty) { margin-top: 14px; padding: 11px 13px; color: var(--text); background: var(--accent-soft); border-radius: 9px; }
    #notice.error { color: var(--danger); background: var(--danger-soft); }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    @media (max-width: 800px) {
      .workspace { height: auto; min-height: 0; grid-template-columns: 1fr; }
      .sidebar { max-height: 430px; }
      .chat { min-height: 70vh; }
      .settings-grid { grid-template-columns: 1fr; }
      .settings-section.wide { grid-column: auto; }
    }
    @media (max-width: 520px) {
      .account #identity { display: none; }
      .workspace, .topbar-inner, #notice { width: min(100% - 20px, 1180px); }
      .chat-head, .inline-form, #composer { align-items: stretch; flex-direction: column; }
      .message-row { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark">C</span><h1>Chat</h1></a>
      <nav class="account" aria-label="账户">
        <img id="identity-avatar" class="avatar small" alt="" referrerpolicy="no-referrer">
        <span id="identity" class="muted">正在登录…</span>
        <button id="logout" class="link" type="button">退出</button>
      </nav>
    </div>
  </header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="workspace">
    <aside class="card sidebar">
      <div class="sidebar-head">
        <h2>会话</h2>
        <p class="muted small">每个会话都可以加入任意成员。</p>
        <form id="create" class="create-form">
          <input id="title" maxlength="100" placeholder="会话名称（可选）" aria-label="会话名称">
          <button type="submit">创建会话</button>
        </form>
      </div>
      <ul id="conversations" aria-label="会话列表"></ul>
    </aside>
    <main class="card chat">
      <header class="chat-head">
        <div>
          <h2 id="conversation-title">请选择会话</h2>
          <p id="connection" class="muted small">正在连接…</p>
        </div>
        <button id="settings" class="secondary" type="button" disabled aria-expanded="false">会话设置</button>
      </header>
      <section id="settings-panel" hidden aria-label="会话设置">
        <div class="settings-grid">
          <section class="settings-section">
            <h3>会话名称</h3>
            <form id="rename-form" class="inline-form">
              <div class="field"><label for="rename-title">名称</label><input id="rename-title" maxlength="100"></div>
              <button type="submit">保存</button>
            </form>
            <p id="rename-status" class="status small" role="status"></p>
          </section>
          <section class="settings-section">
            <h3>链接邀请</h3>
            <p class="muted small">链接 24 小时内有效，只能使用一次。</p>
            <div class="inline-form" style="margin-top:10px">
              <input id="invite-url" readonly placeholder="生成后显示邀请链接" aria-label="邀请链接">
              <button id="invite" type="button">生成</button>
              <button id="copy" class="secondary" type="button" disabled>复制</button>
            </div>
            <p id="invite-status" class="status small" role="status"></p>
          </section>
          <section class="settings-section wide">
            <h3>添加成员</h3>
            <form id="member-search" class="inline-form">
              <div class="field">
                <label for="member-email">完整邮件地址</label>
                <input id="member-email" type="email" autocomplete="off" placeholder="name@example.com" required>
              </div>
              <button type="submit">查找用户</button>
            </form>
            <p class="muted small" style="margin-top:8px">只做完整邮件地址精确匹配；用户需先登录过 Chat。</p>
            <p id="search-status" class="status small" role="status"></p>
            <div id="search-result" class="search-result" hidden></div>
          </section>
          <section class="settings-section wide">
            <h3>会话成员</h3>
            <div id="member-list"><p class="muted small">正在加载…</p></div>
          </section>
          <section class="settings-section wide">
            <h3 id="leave-heading">退出会话</h3>
            <p id="leave-description" class="muted small">退出后将不能发送或接收新消息。</p>
            <button id="leave" class="danger" type="button">退出会话</button>
            <div id="leave-confirm" class="danger-zone" hidden>
              <p id="leave-confirm-text">确定退出当前会话吗？此操作不会删除其他成员的消息。</p>
              <div style="display:flex;gap:8px;margin-top:10px">
                <button id="leave-submit" class="danger" type="button">确认退出</button>
                <button id="leave-cancel" class="secondary" type="button">取消</button>
              </div>
            </div>
          </section>
        </div>
      </section>
      <section id="events" aria-live="polite"><p class="empty">创建或选择一个会话开始聊天</p></section>
      <form id="composer">
        <input id="message" maxlength="8192" autocomplete="off" placeholder="输入消息" aria-label="消息" disabled>
        <button type="submit" disabled>发送</button>
      </form>
    </main>
  </div>
<script>
(() => {
  const state = { user: null, conversations: [], selected: null, events: new Map(), socket: null, reconnect: 500, cache: null, readTimers: new Map(), settingsOpen: false, members: [] };
  const $ = id => document.getElementById(id);

  async function api(endpoint, options = {}) {
    const headers = new Headers(options.headers || {});
    if (options.body) headers.set('Content-Type', 'application/json');
    const response = await fetch(endpoint, {...options, headers});
    if (response.status === 401) { location.href = '/auth/login'; throw new Error('需要登录'); }
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      throw new Error(problem.error?.message || `请求失败 (${response.status})`);
    }
    return response.status === 204 ? null : response.json();
  }

  function setStatus(element, message = '', error = false) {
    element.textContent = message;
    element.classList.toggle('error', error);
  }

  function showNotice(message = '', error = false) { setStatus($('notice'), message, error); }
  function titleOf(conversation) { return conversation.title || '未命名会话'; }
  function userLabel(user) { return user.email || user.display_name || user.username || user.user_id || user.id; }

  function openCache() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(`chat-${state.user.id}`, 1);
      request.onupgradeneeded = () => {
        const store = request.result.createObjectStore('events', {keyPath:'key'});
        store.createIndex('conversation', 'cache_conversation');
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function cacheEvents(events) {
    if (!state.cache || !events.length) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const transaction = state.cache.transaction('events', 'readwrite');
      const store = transaction.objectStore('events');
      for (const item of events) store.put({...item, key:`${item.conversation_id}|${item.seq}`, cache_conversation:item.conversation_id});
      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
    });
  }

  function loadCachedEvents(conversationID) {
    if (!state.cache) return Promise.resolve([]);
    return new Promise((resolve, reject) => {
      const request = state.cache.transaction('events').objectStore('events').index('conversation').getAll(conversationID);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function contiguousSeq(conversation, bucket) {
    let cursor = conversation.joined_seq - 1;
    for (const seq of [...bucket.keys()].sort((left, right) => left - right)) {
      if (seq === cursor + 1) cursor = seq;
      else if (seq > cursor + 1) break;
    }
    return cursor;
  }

  async function bootstrap() {
    state.user = await api('/api/me');
    state.cache = await openCache().catch(() => null);
    $('identity-avatar').src = state.user.avatar_url;
    $('identity').textContent = userLabel(state.user);
    await refreshConversations();
    connect();
  }

  async function refreshConversations() {
    const result = await api('/api/conversations');
    state.conversations = result.conversations;
    if (state.selected) state.selected = state.conversations.find(item => item.id === state.selected.id) || null;
    renderConversations();
  }

  function renderConversations() {
    const list = $('conversations');
    list.replaceChildren();
    if (!state.conversations.length) {
      const empty = document.createElement('li');
      empty.className = 'muted small';
      empty.style.padding = '14px 12px';
      empty.textContent = '还没有会话';
      list.append(empty);
      return;
    }
    for (const conversation of state.conversations) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `conversation-button${state.selected?.id === conversation.id ? ' active' : ''}`;
      const row = document.createElement('span');
      row.className = 'conversation-row';
      const title = document.createElement('span');
      title.textContent = titleOf(conversation);
      row.append(title);
      if (conversation.last_seq > conversation.last_read_seq) {
        const unread = document.createElement('span');
        unread.className = 'unread';
        unread.textContent = '●';
        unread.setAttribute('aria-label', '有新消息');
        row.append(unread);
      }
      button.append(row);
      button.onclick = () => selectConversation(conversation);
      item.append(button);
      list.append(item);
    }
  }

  async function selectConversation(conversation) {
    state.selected = conversation;
    state.settingsOpen = false;
    renderConversations();
    $('conversation-title').textContent = titleOf(conversation);
    $('rename-title').value = conversation.title || '';
    $('settings').disabled = false;
    $('settings').setAttribute('aria-expanded', 'false');
    $('settings-panel').hidden = true;
    $('message').disabled = conversation.status !== 'active';
    $('composer').querySelector('button').disabled = conversation.status !== 'active';
    $('events').replaceChildren();
    await loadMembers().catch(error => showNotice(error.message, true));
    if (!state.events.has(conversation.id)) {
      const cached = await loadCachedEvents(conversation.id);
      const bucket = new Map();
      for (const item of cached) bucket.set(item.seq, item);
      state.events.set(conversation.id, bucket);
      renderEvents();
    }
    await syncEvents(conversation.id, contiguousSeq(conversation, state.events.get(conversation.id)));
  }

  async function syncEvents(conversationID, afterSeq) {
    let cursor = afterSeq;
    for (;;) {
      const result = await api(`/api/conversations/${conversationID}/events?after_seq=${cursor}&limit=200`);
      if (!state.events.has(conversationID)) state.events.set(conversationID, new Map());
      const bucket = state.events.get(conversationID);
      for (const item of result.events) { bucket.set(item.seq, item); cursor = Math.max(cursor, item.seq); }
      await cacheEvents(result.events);
      if (result.events.length < 200) break;
    }
    if (state.selected?.id === conversationID) renderEvents();
  }

  function renderEvents() {
    const section = $('events');
    section.replaceChildren();
    const events = [...(state.events.get(state.selected.id)?.values() || [])].sort((left, right) => left.seq - right.seq);
    if (!events.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '还没有消息';
      section.append(empty);
      return;
    }
    for (const item of events) {
      const node = document.createElement('div');
      if (item.type === 'message.created') {
        const own = item.sender_id === state.user.id;
        node.className = `message-row${own ? ' mine' : ''}`;
        const sender = state.members.find(member => member.user_id === item.sender_id) || (own ? state.user : null);
        const avatar = document.createElement('img');
        avatar.className = 'avatar small';
        avatar.alt = '';
        avatar.loading = 'lazy';
        avatar.referrerPolicy = 'no-referrer';
        if (sender?.avatar_url) avatar.src = sender.avatar_url;
        const body = document.createElement('div');
        body.className = 'message-body';
        const author = document.createElement('div');
        author.className = 'message-author';
        author.textContent = sender ? userLabel(sender) : '未知用户';
        const bubble = document.createElement('div');
        bubble.className = 'message';
        bubble.textContent = item.payload.text;
        body.append(author, bubble);
        node.append(avatar, body);
      } else {
        node.className = 'system';
        const labels = {'conversation.created':'会话已创建','member.joined':'有成员加入了会话','member.left':'有成员退出了会话','member.removed':'有成员被移出会话','conversation.renamed':'会话名称已更新'};
        node.textContent = labels[item.type] || item.type;
      }
      section.append(node);
    }
    section.scrollTop = section.scrollHeight;
    const conversationID = state.selected.id;
    const readSeq = contiguousSeq(state.selected, state.events.get(conversationID));
    if (readSeq >= state.selected.joined_seq) {
      clearTimeout(state.readTimers.get(conversationID));
      state.readTimers.set(conversationID, setTimeout(async () => {
        try {
          await api(`/api/conversations/${conversationID}/read`, {method:'POST', body:JSON.stringify({seq:readSeq})});
          const conversation = state.conversations.find(item => item.id === conversationID);
          if (conversation) conversation.last_read_seq = Math.max(conversation.last_read_seq, readSeq);
          renderConversations();
        } catch {}
      }, 1000));
    }
  }

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${location.host}/ws`);
    state.socket = socket;
    socket.onopen = () => { state.reconnect = 500; $('connection').textContent = '已连接'; };
    socket.onclose = () => {
      $('connection').textContent = '连接断开，正在重连';
      setTimeout(connect, state.reconnect);
      state.reconnect = Math.min(state.reconnect * 2, 10000);
    };
    socket.onmessage = async ({data}) => {
      const message = JSON.parse(data);
      if (message.type === 'conversation.event') {
        const item = message.event;
        if (!state.events.has(item.conversation_id)) state.events.set(item.conversation_id, new Map());
        const bucket = state.events.get(item.conversation_id);
        const known = bucket.size ? Math.max(...bucket.keys()) : 0;
        if (known && item.seq > known + 1) await syncEvents(item.conversation_id, known);
        bucket.set(item.seq, item);
        await cacheEvents([item]);
        let conversation = state.conversations.find(entry => entry.id === item.conversation_id);
        if (!conversation) {
          await refreshConversations();
          conversation = state.conversations.find(entry => entry.id === item.conversation_id);
        }
        if (conversation) conversation.last_seq = Math.max(conversation.last_seq, item.seq);
        if (conversation && item.type === 'conversation.renamed') conversation.title = item.payload.title;
        if (state.selected?.id === item.conversation_id && item.type.startsWith('member.')) await loadMembers();
        if (state.selected?.id === item.conversation_id) renderEvents();
        renderConversations();
      } else if (message.type === 'error') {
        showNotice(message.code, true);
      }
    };
  }

  async function loadMembers() {
    const result = await api(`/api/conversations/${state.selected.id}/members`);
    state.members = result.members;
    const list = $('member-list');
    list.replaceChildren();
    for (const member of state.members) {
      const row = document.createElement('div');
      row.className = 'member-row';
      const identityRow = document.createElement('div');
      identityRow.className = 'identity-row';
      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.alt = '';
      avatar.loading = 'lazy';
      avatar.referrerPolicy = 'no-referrer';
      avatar.src = member.avatar_url;
      const identity = document.createElement('div');
      const email = document.createElement('div');
      email.className = 'member-email';
      email.textContent = member.email || '未提供邮件地址';
      const meta = document.createElement('div');
      meta.className = 'member-meta';
      const role = {owner:'所有者', admin:'管理员', member:'成员'}[member.role] || member.role;
      const status = member.status === 'active' ? '' : ` · ${member.status}`;
      meta.textContent = `${member.display_name || member.username || '用户'} · ${role}${status}`;
      identity.append(email, meta);
      identityRow.append(avatar, identity);
      row.append(identityRow);
      const canRemove = state.selected.status === 'active' && member.status === 'active' && member.user_id !== state.user.id && member.role !== 'owner' && (state.selected.role === 'owner' || (state.selected.role === 'admin' && member.role === 'member'));
      if (canRemove) {
        if (state.selected.role === 'owner') {
          const roleButton = document.createElement('button');
          roleButton.type = 'button';
          roleButton.className = 'secondary';
          roleButton.textContent = member.role === 'admin' ? '设为成员' : '设为管理员';
          roleButton.onclick = async () => {
            roleButton.disabled = true;
            try {
              await api(`/api/conversations/${state.selected.id}/members/${member.user_id}`, {method:'PATCH', body:JSON.stringify({role:member.role === 'admin' ? 'member' : 'admin'})});
              await loadMembers();
            } catch (error) { roleButton.disabled = false; showNotice(error.message, true); }
          };
          row.append(roleButton);
        }
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger';
        remove.textContent = '移除';
        remove.onclick = async () => {
          if (remove.dataset.confirm !== 'true') {
            remove.dataset.confirm = 'true';
            remove.textContent = '再次点击确认';
            return;
          }
          remove.disabled = true;
          try {
            await api(`/api/conversations/${state.selected.id}/members/${member.user_id}`, {method:'DELETE'});
            await loadMembers();
            showNotice(`已移除 ${member.email || '该成员'}`);
          } catch (error) {
            remove.disabled = false;
            remove.dataset.confirm = 'false';
            remove.textContent = '移除';
            showNotice(error.message, true);
          }
        };
        row.append(remove);
      }
      list.append(row);
    }
  }

  $('create').onsubmit = async event => {
    event.preventDefault();
    showNotice();
    try {
      const conversation = await api('/api/conversations', {method:'POST', body:JSON.stringify({title:$('title').value})});
      $('title').value = '';
      await refreshConversations();
      await selectConversation(conversation);
    } catch (error) { showNotice(error.message, true); }
  };

  $('composer').onsubmit = event => {
    event.preventDefault();
    const text = $('message').value;
    if (!text || state.socket?.readyState !== WebSocket.OPEN) return;
    state.socket.send(JSON.stringify({type:'message.send', request_id:crypto.randomUUID(), conversation_id:state.selected.id, client_message_id:crypto.randomUUID(), content:{text}}));
    $('message').value = '';
  };

  $('settings').onclick = async () => {
    state.settingsOpen = !state.settingsOpen;
    $('settings-panel').hidden = !state.settingsOpen;
    $('settings').setAttribute('aria-expanded', String(state.settingsOpen));
    $('settings').textContent = state.settingsOpen ? '收起设置' : '会话设置';
    $('leave-confirm').hidden = true;
    if (state.settingsOpen) {
      $('rename-title').value = state.selected.title || '';
      const canManage = state.selected.status === 'active' && ['owner', 'admin'].includes(state.selected.role);
      $('rename-form').querySelector('button').disabled = !canManage;
      $('member-search').querySelector('button').disabled = !canManage;
      $('member-email').disabled = !canManage;
      $('invite').disabled = !canManage;
      $('leave').disabled = state.selected.status !== 'active';
      const deleting = state.selected.role === 'owner';
      $('leave-heading').textContent = deleting ? '删除会话' : '退出会话';
      $('leave-description').textContent = deleting ? '删除后所有成员都将失去该会话和消息。' : '退出后将不能发送或接收新消息。';
      $('leave').textContent = deleting ? '删除会话' : '退出会话';
      $('leave-confirm-text').textContent = deleting ? '确定为所有成员永久删除当前会话吗？' : '确定退出当前会话吗？此操作不会删除其他成员的消息。';
      $('leave-submit').textContent = deleting ? '确认删除' : '确认退出';
      await loadMembers().catch(error => showNotice(error.message, true));
    }
  };

  $('rename-form').onsubmit = async event => {
    event.preventDefault();
    setStatus($('rename-status'));
    try {
      await api(`/api/conversations/${state.selected.id}`, {method:'PATCH', body:JSON.stringify({title:$('rename-title').value})});
      setStatus($('rename-status'), '会话名称已保存。');
    } catch (error) { setStatus($('rename-status'), error.message, true); }
  };

  $('member-search').onsubmit = async event => {
    event.preventDefault();
    const email = $('member-email').value.trim();
    $('search-result').hidden = true;
    setStatus($('search-status'), '正在查找…');
    try {
      const match = await api(`/api/users/search?email=${encodeURIComponent(email)}`);
      setStatus($('search-status'));
      const result = $('search-result');
      result.replaceChildren();
      const row = document.createElement('div');
      row.className = 'member-row';
      const identityRow = document.createElement('div');
      identityRow.className = 'identity-row';
      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.alt = '';
      avatar.referrerPolicy = 'no-referrer';
      avatar.src = match.avatar_url;
      const identity = document.createElement('div');
      const address = document.createElement('div');
      address.className = 'member-email';
      address.textContent = match.email;
      const name = document.createElement('div');
      name.className = 'member-meta';
      name.textContent = match.display_name || match.username || '用户';
      identity.append(address, name);
      identityRow.append(avatar, identity);
      const add = document.createElement('button');
      add.type = 'button';
      add.textContent = '添加到会话';
      add.onclick = async () => {
        add.disabled = true;
        try {
          await api(`/api/conversations/${state.selected.id}/members`, {method:'POST', body:JSON.stringify({email:match.email})});
          result.hidden = true;
          $('member-email').value = '';
          setStatus($('search-status'), `已添加 ${match.email}`);
          await loadMembers();
        } catch (error) {
          add.disabled = false;
          setStatus($('search-status'), error.message, true);
        }
      };
      row.append(identityRow, add);
      result.append(row);
      result.hidden = false;
    } catch (error) { setStatus($('search-status'), error.message, true); }
  };

  $('invite').onclick = async () => {
    setStatus($('invite-status'), '正在生成…');
    try {
      const result = await api(`/api/conversations/${state.selected.id}/invites`, {method:'POST', body:'{}'});
      $('invite-url').value = result.url;
      $('copy').disabled = false;
      setStatus($('invite-status'), '邀请链接已生成。');
    } catch (error) { setStatus($('invite-status'), error.message, true); }
  };

  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText($('invite-url').value);
      setStatus($('invite-status'), '已复制到剪贴板。');
    } catch {
      $('invite-url').select();
      setStatus($('invite-status'), '请复制已选中的链接。');
    }
  };

  $('leave').onclick = () => { $('leave-confirm').hidden = false; };
  $('leave-cancel').onclick = () => { $('leave-confirm').hidden = true; };
  $('leave-submit').onclick = async () => {
    $('leave-submit').disabled = true;
    try {
      const deleting = state.selected.role === 'owner';
      await api(deleting ? `/api/conversations/${state.selected.id}` : `/api/conversations/${state.selected.id}/leave`, {method:deleting ? 'DELETE' : 'POST'});
      state.selected = null;
      state.settingsOpen = false;
      await refreshConversations();
      $('settings-panel').hidden = true;
      $('settings').disabled = true;
      $('conversation-title').textContent = '请选择会话';
      $('events').replaceChildren();
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '创建或选择一个会话开始聊天';
      $('events').append(empty);
      showNotice(deleting ? '会话已删除。' : '已退出会话。');
    } catch (error) {
      showNotice(error.message, true);
    } finally {
      $('leave-submit').disabled = false;
    }
  };

  $('logout').onclick = async () => {
    await api('/auth/logout', {method:'POST', body:'{}'});
    if (state.cache) state.cache.close();
    indexedDB.deleteDatabase(`chat-${state.user.id}`);
    location.href = '/';
  };

  bootstrap().catch(error => showNotice(error.message, true));
})();
</script>
</body>
</html>
